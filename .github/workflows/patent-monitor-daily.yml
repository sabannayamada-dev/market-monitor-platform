name: Patent monitor daily

on:
  schedule:
    # 06:15 JST. GitHub cron is UTC and can start several minutes late.
    - cron: "15 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: patent-monitor-daily
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PATENT_TIMEZONE: Asia/Tokyo
      PATENT_CONFIG_PATH: patent_monitor_config.json
      PATENT_COMPANY_MASTER: patent_company_master.csv
      PATENT_OUTPUT_DIR: outputs/patent_monitor
      PATENT_DB_PATH: outputs/patent_monitor/patent_monitor.sqlite3
      PATENT_LOOKBACK_DAYS: "3"
      PATENT_MAX_PER_COMPANY: "100"
      PATENT_ENABLE_MARKET_FEEDBACK: "true"
      PATENT_REQUIRE_SUPABASE: "true"
      PATENT_DAILY_DIGEST_ENABLED: ${{ vars.PATENT_DAILY_DIGEST_ENABLED || 'true' }}
      PATENT_URGENT_NOTIFICATIONS_ENABLED: ${{ vars.PATENT_URGENT_NOTIFICATIONS_ENABLED || 'true' }}
      PATENT_URGENT_MAX_SHARE: ${{ vars.PATENT_URGENT_MAX_SHARE || '0.01' }}
      PATENT_URGENT_MIN_IMPORTANCE: ${{ vars.PATENT_URGENT_MIN_IMPORTANCE || '98' }}
      PATENT_URGENT_MIN_SHORT_TERM: ${{ vars.PATENT_URGENT_MIN_SHORT_TERM || '95' }}
      PATENT_URGENT_MIN_MATERIALITY: ${{ vars.PATENT_URGENT_MIN_MATERIALITY || '95' }}
      PATENT_URGENT_MIN_COMPANY_PERCENTILE: ${{ vars.PATENT_URGENT_MIN_COMPANY_PERCENTILE || '99' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EPO_OPS_KEY: ${{ secrets.EPO_OPS_KEY }}
      EPO_OPS_SECRET: ${{ secrets.EPO_OPS_SECRET }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      SMTP_USER: ${{ vars.SMTP_USER }}
      EMAIL_RECIPIENT: ${{ vars.EMAIL_RECIPIENT }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_STORAGE_BUCKET: ${{ vars.SUPABASE_STORAGE_BUCKET }}
      SUPABASE_DB_OBJECT: ${{ vars.SUPABASE_DB_OBJECT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_patent_monitor.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements_patent_monitor.txt

      - name: Validate configuration and mock pipeline
        run: |
          python -m unittest test_patent_monitor.py test_supabase_state.py
          python validate_patent_monitor_mock.py

      - name: Run daily patent monitor
        run: python -u patent_monitor_daily.py

      - name: Upload diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patent-monitor-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            outputs/patent_monitor/daily_logs/
            outputs/patent_monitor/*/*.csv
            outputs/patent_monitor/*/*.json
            outputs/patent_monitor/patent_market_outcomes.csv
            outputs/patent_monitor/patent_learning_model.json
            !outputs/patent_monitor/**/*.sqlite3
            !outputs/patent_monitor/**/*.sqlite3-*
